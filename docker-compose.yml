version: '3.8'

services:
  # =============================================================================
  # BOND MOVIES API
  # =============================================================================

  bond-movies-api-nodejs:
    profiles: [bond-nodejs]
    build:
      context: ./bond-movies-api-nodejs
      dockerfile: ./Dockerfile
    depends_on:
      - dynamodb
    environment:
      BOND_ENV: docker
    ports:
      - "3001:3001"
    working_dir: /opt/bond-movies-api

  bond-movies-api-spring-dynamodb:
    profiles: [bond-spring-dynamodb]
    build:
      context: ./bond-movies-api-spring-dynamodb
      dockerfile: ./Dockerfile
    depends_on:
      - dynamodb
    environment:
      BOND_ENV: docker
    ports:
      - "3002:3002"
    working_dir: /

  bond-movies-api-spring-postgresql:
    profiles: [bond-spring-postgresql]
    build:
      context: ./bond-movies-api-spring-postgresql
      dockerfile: ./Dockerfile
    depends_on:
      - postgresql
    environment:
      BOND_ENV: docker
    ports:
      - "3003:3003"
    working_dir: /

  # =============================================================================
  # METADATA API
  # =============================================================================

  movie-metadata-api-nodejs:
    profiles: [metadata-nodejs]
    build:
      context: ./movie-metadata-api-nodejs/
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      BOND_ENV: docker
    ports:
      - "3004:3004"

  movie-metadata-api-spring:
    profiles: [metadata-spring]
    build:
      context: ./movie-metadata-api-spring/
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      BOND_ENV: docker
    ports:
      - "3008:3008"

  # =============================================================================
  # PROCESS QUEUE API
  # =============================================================================

  review-updates-api-nodejs-kafkajs-kafka:
    profiles: [queue-kafkajs]
    build:
      context: ./process-queue-kafkajs
      dockerfile: Dockerfile
    depends_on:
      - kafka
    environment:
      ADV_HOST: kafka1
      BOND_ENV: docker
      BOND_MOVIES_API_URL: ${BOND_MOVIES_API_URL}
      MOVIE_METADATA_API_URL: ${MOVIE_METADATA_API_URL}
    ports:
      - "3006:3006"

  review-updates-api-nodejs-redis:
    profiles: [queue-redis]
    build:
      context: ./process-queue-nodejs-redis
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      BOND_ENV: docker
      BOND_MOVIES_API_URL: ${BOND_MOVIES_API_URL}
      MOVIE_METADATA_API_URL: ${MOVIE_METADATA_API_URL}
    ports:
      - "3009:3009"

  review-updates-api-spring-camel-kafka:
    profiles: [queue-spring-camel]
    build:
      context: .
      dockerfile: process-queue-spring-camel-kafka/Dockerfile
    depends_on:
      - kafka
    environment:
      ADV_HOST: kafka1
      BOND_ENV: docker
      BOND_MOVIES_API_URL: ${BOND_MOVIES_API_URL}
      MOVIE_METADATA_API_URL: ${MOVIE_METADATA_API_URL}
    ports:
      - "3010:3010"

  # =============================================================================
  # UI
  # =============================================================================

  vanilla:
    profiles: [ui]
    build:
      context: ./fe/vanilla
      dockerfile: Dockerfile
    environment:
      BOND_MOVIES_API_URL: ${BOND_MOVIES_API_URL:-http://bond-movies-api-nodejs:3001}
    ports:
      - "3007:80"

  # =============================================================================
  # WATCH REVIEWS
  # =============================================================================

  watch-reviews:
    profiles: [watch]
    build:
      context: ./watch-reviews
      dockerfile: Dockerfile
    environment:
      BOND_ENV: docker
      REVIEW_UPDATES_API_URL: ${REVIEW_UPDATES_API_URL}
    volumes:
      - ./watch-reviews/storage:/opt/watch_reviews/storage

  # =============================================================================
  # INFRASTRUCTURE (no profiles - started via depends_on)
  # =============================================================================

  dynamodb:
    entrypoint: ["java", "-Djava.library.path=./DynamoDBLocal_lib", "-jar", "DynamoDBLocal.jar", "-sharedDb"]
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - ./storage/dynamodb-data:/data
    working_dir: /home/dynamodblocal

  postgresql:
    command: ["postgres", "-c", "log_statement=all"]
    environment:
      POSTGRES_DB: bond_movies
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: bond_movies
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data

  pgadmin:
    profiles: [pgadmin]
    image: dpage/pgadmin4
    depends_on:
      - postgresql
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - ./pgadmin:/root/.pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    restart: unless-stopped

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    ports:
      - "6375:6375"

  kafka:
    container_name: kafka1
    hostname: kafka1
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka1:19092,CONTROLLER://kafka1:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - ./storage/kafka/data:/var/lib/kafka/data
